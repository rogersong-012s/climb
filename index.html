          <div class="track-zones" id="track-zones" aria-hidden="true"></div>
          <div class="rhythm-ball-position" id="rhythm-ball" aria-hidden="true">
            <div class="rhythm-ball-visual" id="rhythm-ball-visual"><span></span></div>
          </div>
        </div>
        <div class="rhythm-footer">
          <div class="best-record"><span>BEST</span><strong id="best-value">尚未登頂</strong></div>
          <span class="control-hint"><span class="desktop-hint">SPACE</span><span class="mobile-hint">點擊任意處</span> 依序踩拍</span>
        </div>
      </section>

      <div class="modal-layer" id="modal-layer" hidden></div>
      <div class="purify-frame" id="purify-frame" aria-hidden="true"></div>
      <div class="screen-reader-only" id="announcer" aria-live="assertive"></div>
    </main>
  </body>
</html>
